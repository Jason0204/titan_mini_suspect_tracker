[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-suspect-tracker-ui"
version = "0.1.0"
description = "PySide6 UI for Titan mini board suspect identification and tracking"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # 版本下限对应 requirements.txt 里锁定并实测过的版本
    "PySide6>=6.11.2",
    "numpy>=2.0",          # opencv-python 5.x 在 Python>=3.9 上要求 numpy>=2
    "opencv-python>=4.9",
    "pyserial>=3.5",
]

[project.scripts]
titan-suspect-tracker = "suspect_tracker.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
